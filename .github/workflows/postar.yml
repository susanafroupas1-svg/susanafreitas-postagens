name: Postar no Instagram

on:
  schedule:
    - cron: "*/10 * * * *"   # o GitHub atrasa muito (~1x/hora); por isso cada execucao fica vigiando a fila por quase 3 h
  workflow_dispatch:         # permite rodar manualmente em Actions > Run workflow

permissions:
  contents: write

concurrency:
  group: instagram-poster
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias da sincronizacao (Pillow + fontes das artes)
        run: |
          pip install -q pillow
          sudo apt-get install -y -qq fonts-liberation fonts-crosextra-carlito >/dev/null

      - name: Vigiar a fila e publicar no horario (minuto a minuto)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          bash ferramentas/ciclo.sh 165
