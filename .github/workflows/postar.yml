name: Postar no Instagram

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 min; o GitHub pode atrasar alguns minutos
  workflow_dispatch:         # permite rodar manualmente em Actions > Run workflow

permissions:
  contents: write

concurrency:
  group: instagram-poster
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar itens vencidos
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python ferramentas/postar.py --executar

      - name: Salvar status da fila
        run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add instagram/fila_postagens.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualiza status da fila de postagens"
            git push
          fi
